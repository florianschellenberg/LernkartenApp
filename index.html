<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernkarten App</title>
  <style>
    :root {
      --primary: #007bff;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f4f7f6;
      --text: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }

    h1 { margin-bottom: 5px; font-size: 24px; text-align: center; }

    /* Auswahl des Kartensets */
    .deck-picker {
      width: 100%;
      max-width: 350px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 15px;
    }

    .deck-picker label {
      font-size: 14px;
      color: #666;
      white-space: nowrap;
    }

    .deck-picker select {
      flex: 1;
      padding: 8px 10px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background-color: white;
      border: 1px solid #ccd3d1;
      border-radius: 6px;
      cursor: pointer;
    }

    .deck-picker select:disabled {
      color: #999;
      cursor: default;
    }

    .status-bar {
      width: 100%;
      max-width: 350px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 14px;
      color: #666;
    }

    /* 3D-Kartenstil */
    .scene {
      width: 100%;
      max-width: 350px;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
      backface-visibility: hidden;
      font-size: 18px;
      overflow-y: auto;
    }

    .card-back {
      background-color: #f9f9f9;
      color: var(--primary);
      transform: rotateY(180deg);
    }

    /* Lern-Buttons */
    .learning-controls {
      display: none;
      gap: 15px;
      margin-top: 20px;
      width: 100%;
      max-width: 350px;
    }

    .learn-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .know-btn { background-color: var(--success); }
    .dont-know-btn { background-color: var(--danger); }

    .controls, .done-container {
      margin-top: 20px;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background-color: #6c757d;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .primary-btn { background-color: var(--primary); }
    .secondary-btn { background-color: #e2e6ea; color: var(--text); }

    .done-container {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .hidden { display: none !important; }

    /* Version Badge */
    .version-badge {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: #999;
      background-color: transparent;
      padding: 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1 id="deck-title">Lernkarten</h1>

  <div class="deck-picker">
    <label for="deck-select">Kartenset</label>
    <select id="deck-select" disabled>
      <option>Lade…</option>
    </select>
  </div>

  <div class="status-bar">
    <span id="card-counter">Lade Karten...</span>
    <span id="learned-counter">Gelernt: 0</span>
  </div>

  <div class="scene" id="card-scene" onclick="flipCard()">
    <div class="card" id="card-element">
      <div class="card-face card-front" id="card-question">Lade...</div>
      <div class="card-face card-back" id="card-answer">Lade...</div>
    </div>
  </div>

  <div class="learning-controls" id="learning-controls">
    <button class="learn-btn dont-know-btn" onclick="markAsUnknown()">Nicht gewusst 👎</button>
    <button class="learn-btn know-btn" onclick="markAsKnown()">Gewusst 👍</button>
  </div>

  <div class="controls" id="standard-controls">
    <div class="nav-btns">
      <button class="secondary-btn" style="flex:1" onclick="prevCard()">Zurück</button>
      <button class="primary-btn" style="flex:1" onclick="nextCard()">Weiter</button>
    </div>
  </div>

  <div class="done-container" id="done-container">
    <h2>🎉 Super gemacht!</h2>
    <p>Du hast alle Karten dieses Sets gelernt.</p>
    <button class="primary-btn" onclick="resetLearning()">Lernstatus dieses Sets zurücksetzen</button>
  </div>

  <div class="version-badge" id="version-badge">v1.1.0</div>

  <script src="csv-parser.js"></script>
  <script src="decks.js"></script>
  <script>
    const APP_VERSION = '1.1.0';

    // Ordner, in den die .csv-Dateien hochgeladen werden. Mehr ist zum Anlegen
    // eines neuen Kartensets nicht nötig — die Liste entsteht automatisch,
    // siehe decks.js.
    const DECK_FOLDER = LernkartenDecks.folder;

    const LAST_DECK_KEY = 'flashcards_last_deck';
    const LEGACY_PROGRESS_KEY = 'flashcards_learned_ids';
    const LEGACY_PROGRESS_DECK = 'Transaktionsanalyse.csv';

    let currentDeck = null;
    let allCards = [];
    // IDs der Karten, die der Nutzer im aktuellen Set schon kann
    let learnedIds = [];
    let cardsToLearn = [];
    let currentIndex = 0;
    let showingQuestion = true;

    const deckTitle = document.getElementById('deck-title');
    const deckSelect = document.getElementById('deck-select');
    const cardElement = document.getElementById('card-element');
    const questionElement = document.getElementById('card-question');
    const answerElement = document.getElementById('card-answer');
    const learningControls = document.getElementById('learning-controls');
    const standardControls = document.getElementById('standard-controls');
    const cardScene = document.getElementById('card-scene');
    const doneContainer = document.getElementById('done-container');
    const cardCounter = document.getElementById('card-counter');
    const learnedCounter = document.getElementById('learned-counter');
    const versionBadge = document.getElementById('version-badge');

    const deckLabel = LernkartenDecks.label;

    function progressKey(deck) {
      return `flashcards_learned::${deck}`;
    }

    /*
     * Der Parser aus v1.0.0, reduziert auf die Fragetexte.
     *
     * Wird nur noch für die Migration des Lernstatus gebraucht: die alten
     * Positionsnummern beziehen sich auf das Ergebnis *dieses* Parsers. Er
     * übersprang Zeilen ohne `,"` — der heutige Parser liest sie, wodurch sich
     * alle nachfolgenden Positionen verschieben. Deshalb wird über den
     * Fragetext abgeglichen und nicht über den Index.
     *
     * Kann entfernt werden, sobald die Migration überall gelaufen ist.
     */
    function legacyQuestions(csvText) {
      return csvText.trim().split('\n')
        .map(line => line.trim())
        .filter(line => line && line.lastIndexOf(',"') !== -1)
        .map(line => line.substring(0, line.lastIndexOf(',"')).trim());
    }

    /*
     * Lernfortschritt des Sets laden.
     *
     * Bis v1.0.0 lag der Fortschritt in einem einzigen Key und bestand aus
     * laufenden Nummern der damaligen karten.csv. Diese werden einmalig auf die
     * jetzt verwendeten, inhaltsbasierten IDs umgeschrieben, damit bereits
     * gelernte Karten gelernt bleiben.
     */
    function loadProgress(deck, cards, csvText) {
      let ids = [];
      try {
        ids = JSON.parse(localStorage.getItem(progressKey(deck))) || [];
      } catch (error) {
        ids = [];
      }

      const legacy = localStorage.getItem(LEGACY_PROGRESS_KEY);
      if (deck === LEGACY_PROGRESS_DECK && legacy !== null) {
        try {
          const positions = JSON.parse(legacy) || [];
          const questions = legacyQuestions(csvText);
          const idByQuestion = new Map(cards.map(card => [card.question, card.id]));
          let migrated = 0;

          positions.forEach(position => {
            const id = idByQuestion.get(questions[position - 1]);   // alt: 1-basierte Position
            if (id && !ids.includes(id)) { ids.push(id); migrated++; }
          });

          console.log(`♻️ ${migrated}/${positions.length} Einträge aus dem alten Lernstatus übernommen`);
        } catch (error) {
          console.log('⚠️ Alter Lernstatus unlesbar, wird verworfen:', error.message);
        }
        localStorage.removeItem(LEGACY_PROGRESS_KEY);
        localStorage.setItem(progressKey(deck), JSON.stringify(ids));
      }

      return ids;
    }

    // Zeigt einen Hinweis auf der Kartenfläche statt einer Karte
    function showMessage(text) {
      allCards = [];
      cardsToLearn = [];
      resetFlip();
      cardScene.classList.remove('hidden');
      questionElement.textContent = text;
      answerElement.textContent = text;
      standardControls.classList.add('hidden');
      learningControls.classList.add('hidden');
      doneContainer.style.display = 'none';
      cardCounter.textContent = '—';
      learnedCounter.textContent = 'Gelernt: 0';
    }

    // Ein Kartenset laden und anzeigen
    async function loadDeck(deck) {
      currentDeck = deck;
      localStorage.setItem(LAST_DECK_KEY, deck);
      deckTitle.textContent = deckLabel(deck);
      deckSelect.value = deck;
      currentIndex = 0;
      resetFlip();
      cardCounter.textContent = 'Lade Karten...';

      let csvText;
      let result;
      try {
        const response = await fetch(LernkartenDecks.path(deck), { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        csvText = await response.text();
        result = LernkartenCSV.parse(csvText);
      } catch (error) {
        if (currentDeck !== deck) return;
        console.log(`❌ Fehler beim Laden von ${deck}:`, error.message);
        showMessage(`„${deckLabel(deck)}“ konnte nicht geladen werden.`);
        return;
      }

      // Wurde während des Ladens schon wieder umgeschaltet, gewinnt die neuere
      // Auswahl — sonst könnte eine langsamere Antwort sie überschreiben.
      if (currentDeck !== deck) return;

      if (result.skipped) {
        console.log(`⚠️ ${result.skipped} Zeile(n) in ${deck} übersprungen (keine zwei Spalten).`);
      }

      if (!result.cards.length) {
        showMessage(`„${deckLabel(deck)}“ enthält keine lesbaren Karten.`);
        return;
      }

      allCards = result.cards;
      learnedIds = loadProgress(deck, allCards, csvText);
      console.log(`✅ ${allCards.length} Karten aus ${deck} geladen`);
      updateUI();
    }

    function saveLearnedProgress() {
      if (!currentDeck) return;
      localStorage.setItem(progressKey(currentDeck), JSON.stringify(learnedIds));
    }

    function updateUI() {
      // Nur Karten filtern, deren ID noch nicht in learnedIds ist
      cardsToLearn = allCards.filter(card => !learnedIds.includes(card.id));
      learnedCounter.textContent = `Gelernt: ${learnedIds.length} / ${allCards.length}`;

      if (cardsToLearn.length === 0 && allCards.length > 0) {
        cardScene.classList.add('hidden');
        learningControls.classList.add('hidden');
        standardControls.classList.add('hidden');
        doneContainer.style.display = 'block';
        cardCounter.textContent = "0/0";
        return;
      }

      cardScene.classList.remove('hidden');
      standardControls.classList.remove('hidden');
      // Ohne dies bliebe die Klasse nach dem "alles gelernt"-Zustand kleben und
      // das !important aus .hidden würde das Einblenden beim Umdrehen blockieren.
      learningControls.classList.remove('hidden');
      doneContainer.style.display = 'none';

      if (currentIndex >= cardsToLearn.length) currentIndex = 0;

      cardCounter.textContent = `Karte ${currentIndex + 1}/${cardsToLearn.length}`;
      questionElement.textContent = cardsToLearn[currentIndex].question;
      answerElement.textContent = cardsToLearn[currentIndex].answer;
    }

    function flipCard() {
      if (cardsToLearn.length === 0) return;
      cardElement.classList.toggle('is-flipped');
      showingQuestion = !showingQuestion;
      learningControls.style.display = showingQuestion ? 'none' : 'flex';
    }

    function nextCard() {
      if (cardsToLearn.length === 0) return;
      resetFlip();
      currentIndex = (currentIndex + 1) % cardsToLearn.length;
      updateUI();
    }

    function prevCard() {
      if (cardsToLearn.length === 0) return;
      resetFlip();
      currentIndex = (currentIndex - 1 + cardsToLearn.length) % cardsToLearn.length;
      updateUI();
    }

    function resetFlip() {
      cardElement.classList.remove('is-flipped');
      learningControls.style.display = 'none';
      showingQuestion = true;
    }

    function markAsKnown() {
      const currentCard = cardsToLearn[currentIndex];
      if (!learnedIds.includes(currentCard.id)) {
        learnedIds.push(currentCard.id);
        saveLearnedProgress();
      }
      resetFlip();
      if (currentIndex >= cardsToLearn.length - 1) currentIndex = 0;
      updateUI();
    }

    function markAsUnknown() {
      nextCard();
    }

    function resetLearning() {
      learnedIds = [];
      saveLearnedProgress();
      currentIndex = 0;
      updateUI();
    }

    // Kartenset wechseln
    deckSelect.addEventListener('change', () => loadDeck(deckSelect.value));

    async function init() {
      versionBadge.textContent = `v${APP_VERSION}`;

      const decks = await LernkartenDecks.list();

      if (!decks.length) {
        deckSelect.innerHTML = '<option>Keine Sets gefunden</option>';
        showMessage(`Keine Lernkarten gefunden. Lege .csv-Dateien im Ordner „${DECK_FOLDER}“ ab.`);
        return;
      }

      deckSelect.innerHTML = '';
      decks.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = deckLabel(name);
        deckSelect.appendChild(option);
      });
      deckSelect.disabled = false;

      const last = localStorage.getItem(LAST_DECK_KEY);
      await loadDeck(decks.includes(last) ? last : decks[0]);
    }

    // Startet die App
    init();
  </script>
</body>
</html>
